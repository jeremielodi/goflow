# HAProxy in front of the Patroni cluster: GoFlow always reaches the
# current primary on 5000, and any node that can serve reads on 5001.
# Patroni's REST API (port 8008) answers 200 on /primary only on the
# primary, and on /read-only on the primary and healthy replicas, so a
# failover moves the traffic within a few seconds. Connections to the old
# primary are cut (shutdown-sessions); GoFlow reopens them.
#
# PG1_ADDR, PG2_ADDR, PG3_ADDR: the Postgres nodes (container names in the
# local test, server addresses in production).

global
    maxconn 4000

defaults
    mode tcp
    timeout connect 4s
    # LISTEN connections stay idle for long stretches: don't cut them.
    timeout client 24h
    timeout server 24h
    timeout check 5s

listen primary
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 "${PG1_ADDR}:5432" maxconn 1000 check port 8008
    server pg2 "${PG2_ADDR}:5432" maxconn 1000 check port 8008
    server pg3 "${PG3_ADDR}:5432" maxconn 1000 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    # /read-only: a healthy replica or the primary — reads stay available
    # with no replica up.
    option httpchk OPTIONS /read-only
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 "${PG1_ADDR}:5432" maxconn 1000 check port 8008
    server pg2 "${PG2_ADDR}:5432" maxconn 1000 check port 8008
    server pg3 "${PG3_ADDR}:5432" maxconn 1000 check port 8008

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
