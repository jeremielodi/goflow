# Load balancer for several GoFlow instances (docker-compose.scale.yaml).
# "goflow" resolves, through Docker's DNS, to every replica of the goflow
# service; nginx spreads requests across them round-robin.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # WebSocket upgrades pass through; other requests reuse kept-alive
    # upstream connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream goflow_http {
        server goflow:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        client_max_body_size 50m;

        location / {
            proxy_pass http://goflow_http;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Server-sent events and long polls: no buffering, long reads.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }

    # gRPC gateway (Zeebe protocol): HTTP/2 end to end. Long-polling
    # ActivateJobs and StreamActivatedJobs keep calls open.
    upstream goflow_grpc {
        server goflow:26500;
    }

    server {
        listen 26500;
        http2 on;

        location / {
            grpc_pass grpc://goflow_grpc;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
    }
}
