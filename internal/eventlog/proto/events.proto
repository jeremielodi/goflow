syntax = "proto3";

package eventlog_protocol;

option go_package = "github.com/jeremielodi/goflow/internal/eventlog/pb";

import "google/protobuf/timestamp.proto";

// events.proto — Phase 0 ("shadow mode") domain event schema for GoFlow's
// event-sourced engine scoping. See architecture/event-sourced-kafka-design.md
// for the full context: this schema exists to validate a Kafka-compatible
// event backbone (Redpanda in this dev stack) alongside the existing
// Postgres-transactional engine, which remains the only write path and
// source of truth in Phase 0. Nothing here is consumed by anything that
// affects engine behavior yet — a shadow consumer just proves the pipe is
// durable, ordered (per process instance, via partition-key routing on
// process_instance_id), and well-formed.
//
// Coverage: the original 7 messages (fields 10-16) are the core process/job
// lifecycle. The next 8 (fields 17-24) extend coverage to every other
// transition already instrumented by internal/service/audit_service.go's
// generic Log* methods (execution movement, gateway fork/join, timers,
// message/signal correlation) — mirroring those same call sites rather than
// inventing new per-BPMN-element event logic.

message ProcessStarted {
  string process_instance_id = 1;
  string process_definition_id = 2;
  string process_key = 3;
  int32 version = 4;
}

message JobCreated {
  string job_id = 1;
  string process_instance_id = 2;
  string execution_id = 3;
  string job_type = 4;
}

message JobCompleted {
  string job_id = 1;
  string process_instance_id = 2;
}

message JobFailed {
  string job_id = 1;
  string process_instance_id = 2;
  string error_message = 3;
  int32 retries_remaining = 4;
  bool incident_created = 5;
}

message IncidentResolved {
  string incident_id = 1;
  string job_id = 2;
  string process_instance_id = 3;
}

message ProcessTerminated {
  string process_instance_id = 1;
  string reason = 2;
}

message ProcessCompleted {
  string process_instance_id = 1;
}

message ExecutionCreated {
  string execution_id = 1;
  string process_instance_id = 2;
  string parent_execution_id = 3;
  string node_id = 4;
}

message ExecutionMoved {
  string execution_id = 1;
  string process_instance_id = 2;
  string from_node = 3;
  string to_node = 4;
}

message ExecutionCompleted {
  string execution_id = 1;
  string process_instance_id = 2;
  string node_id = 3;
}

message GatewayForked {
  string process_instance_id = 1;
  string gateway_id = 2;
  int32 child_executions = 3;
}

message GatewayJoined {
  string process_instance_id = 1;
  string gateway_id = 2;
  int32 expected_count = 3;
  int32 received_count = 4;
}

message TimerTriggered {
  string process_instance_id = 1;
  string timer_id = 2;
  string timer_type = 3;
}

message MessageCorrelated {
  string process_instance_id = 1;
  string message_name = 2;
}

// SignalBroadcast has no process_instance_id — a broadcast spans zero or
// more instances, not one. Published with an empty partition key.
message SignalBroadcast {
  string signal_name = 1;
  int32 resumed_count = 2;
}

// JobRetriesSet (Phase 5 gap-closing pass): published unconditionally by
// service.SetJobRetries, unlike IncidentResolved (field 14) which only
// fires when an open incident actually existed for the job — this is the
// Command Gateway's reliable confirmation signal regardless of that.
message JobRetriesSet {
  string job_id = 1;
  string process_instance_id = 2;
  int32 retries = 3;
}

// Envelope is the single message type actually written to the Kafka/Redpanda
// topic. process_instance_id is duplicated at this level (also present on
// every inner event) so a consumer can route/partition without unwrapping
// the oneof first.
message Envelope {
  string event_id = 1;
  string process_instance_id = 2;
  google.protobuf.Timestamp occurred_at = 3;

  oneof event {
    ProcessStarted process_started = 10;
    JobCreated job_created = 11;
    JobCompleted job_completed = 12;
    JobFailed job_failed = 13;
    IncidentResolved incident_resolved = 14;
    ProcessTerminated process_terminated = 15;
    ProcessCompleted process_completed = 16;
    ExecutionCreated execution_created = 17;
    ExecutionMoved execution_moved = 18;
    ExecutionCompleted execution_completed = 19;
    GatewayForked gateway_forked = 20;
    GatewayJoined gateway_joined = 21;
    TimerTriggered timer_triggered = 22;
    MessageCorrelated message_correlated = 23;
    SignalBroadcast signal_broadcast = 24;
    JobRetriesSet job_retries_set = 25;
  }
}
