syntax = "proto3";

package gateway_protocol;

option go_package = "github.com/jeremielodi/goflow/internal/zeebegrpc/pb";

// gateway.proto — GoFlow's implementation of a subset of Zeebe's Gateway
// Protocol (see https://github.com/camunda/camunda, module
// zeebe/gateway-protocol). Implements the 6 RPCs that make up Zeebe's
// core client loop (Topology, DeployResource, CreateProcessInstance,
// ActivateJobs, CompleteJob, FailJob) plus 5 more that each reuse an
// existing GoFlow service/engine function with no new business logic
// (PublishMessage, CancelProcessInstance, EvaluateDecision,
// ResolveIncident, ModifyProcessInstance). Any other method a real Zeebe
// client SDK calls (MigrateProcessInstance, ...) is not registered on
// this server at all, so grpc-go returns a standard UNIMPLEMENTED
// status automatically for that method path — the same experience a
// real client gets calling an unsupported RPC against an
// older/limited broker, no special-casing needed on our side.
//
// ModifyProcessInstance note: real Zeebe's actual request also has a
// dedicated `moveInstructions` field and richer activate/variable
// instructions, but the zeebe-node SDK version this project tests
// against predates that addition — its ModifyProcessInstanceRequest only
// has activateInstructions/terminateInstructions, and its
// TerminateInstruction has no elementId, only an opaque
// elementInstanceKey GoFlow has no mapping for. So this implementation
// only supports one implied move per call, deriving the source element
// from the instance's single active execution — see the ModifyProcessInstance
// handler in internal/zeebegrpc/server.go for the full rationale.
//
// Message field NAMES, NUMBERS, and TYPES below are matched to the real
// Zeebe protocol where implemented — this is required for wire
// compatibility with unmodified Zeebe client SDKs (protobuf wire bytes
// are keyed by field number+type, not name). This file is authored
// independently rather than vendoring Camunda's source file, since exact
// field numbers/types are the only part that's functionally unavoidable
// for compatibility (the same category of thing GoFlow already does
// throughout this codebase by matching Camunda 7/8's exact REST paths
// and JSON shapes). Fields from newer/advanced Zeebe features not needed
// for the core loop (start instructions, task listeners, tags, business
// keys, multi-tenant partition filters, etc.) are intentionally omitted
// — proto3 silently preserves unknown fields, so a real client that sets
// them is unaffected for the fields we DO implement.
//
// Regenerate after editing (see buf.yaml / buf.gen.yaml in this directory):
//   buf generate

service Gateway {
  rpc Topology(TopologyRequest) returns (TopologyResponse);
  rpc DeployResource(DeployResourceRequest) returns (DeployResourceResponse);
  rpc CreateProcessInstance(CreateProcessInstanceRequest) returns (CreateProcessInstanceResponse);
  rpc ActivateJobs(ActivateJobsRequest) returns (stream ActivateJobsResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
  rpc FailJob(FailJobRequest) returns (FailJobResponse);
  rpc PublishMessage(PublishMessageRequest) returns (PublishMessageResponse);
  rpc CancelProcessInstance(CancelProcessInstanceRequest) returns (CancelProcessInstanceResponse);
  rpc EvaluateDecision(EvaluateDecisionRequest) returns (EvaluateDecisionResponse);
  rpc ResolveIncident(ResolveIncidentRequest) returns (ResolveIncidentResponse);
  rpc ModifyProcessInstance(ModifyProcessInstanceRequest) returns (ModifyProcessInstanceResponse);
}

// ── Topology ────────────────────────────────────────────────────────────
// GoFlow is a single-node monolith, so this always reports one synthetic
// broker owning one partition as LEADER/HEALTHY — real client SDKs
// commonly call this first as a connectivity check.

message TopologyRequest {}

message TopologyResponse {
  repeated BrokerInfo brokers = 1;
  int32 clusterSize = 2;
  int32 partitionsCount = 3;
  int32 replicationFactor = 4;
  string gatewayVersion = 5;
}

message BrokerInfo {
  int32 nodeId = 1;
  string host = 2;
  int32 port = 3;
  repeated Partition partitions = 4;
  string version = 5;
}

enum PartitionBrokerRole {
  LEADER = 0;
  FOLLOWER = 1;
  INACTIVE = 2;
}

enum PartitionBrokerHealth {
  HEALTHY = 0;
  UNHEALTHY = 1;
  DEAD = 2;
}

message Partition {
  int32 partitionId = 1;
  PartitionBrokerRole role = 2;
  PartitionBrokerHealth health = 3;
}

// ── DeployResource ──────────────────────────────────────────────────────

message Resource {
  string name = 1;
  bytes content = 2;
}

message DeployResourceRequest {
  repeated Resource resources = 1;
  string tenantId = 2;
}

message DeployResourceResponse {
  int64 key = 1;
  repeated Deployment deployments = 2;
  string tenantId = 3;
}

// Only the `process` branch is ever populated by this server (DMN/form
// deployment via gRPC is out of scope this pass, even though the
// underlying DeployResources service call deploys them if present in the
// same request) — the other branches are declared for wire-shape
// completeness only.
message Deployment {
  oneof Metadata {
    ProcessMetadata process = 1;
    DecisionMetadata decision = 2;
    DecisionRequirementsMetadata decisionRequirements = 3;
    FormMetadata form = 4;
  }
}

message ProcessMetadata {
  string bpmnProcessId = 1;
  int32 version = 2;
  int64 processDefinitionKey = 3;
  string resourceName = 4;
  string tenantId = 5;
}

message DecisionMetadata {}
message DecisionRequirementsMetadata {}
message FormMetadata {}

// ── CreateProcessInstance ───────────────────────────────────────────────

message CreateProcessInstanceRequest {
  int64 processDefinitionKey = 1;
  string bpmnProcessId = 2;
  int32 version = 3;
  string variables = 4;
  // field 5 (startInstructions) intentionally omitted — out of scope.
  string tenantId = 6;
}

message CreateProcessInstanceResponse {
  int64 processDefinitionKey = 1;
  string bpmnProcessId = 2;
  int32 version = 3;
  int64 processInstanceKey = 4;
  string tenantId = 5;
}

// ── ActivateJobs (server-streaming) ─────────────────────────────────────

message ActivateJobsRequest {
  string type = 1;
  string worker = 2;
  int64 timeout = 3;
  int32 maxJobsToActivate = 4;
  repeated string fetchVariable = 5;
  int64 requestTimeout = 6;
}

message ActivateJobsResponse {
  repeated ActivatedJob jobs = 1;
}

message ActivatedJob {
  int64 key = 1;
  string type = 2;
  int64 processInstanceKey = 3;
  string bpmnProcessId = 4;
  int32 processDefinitionVersion = 5;
  int64 processDefinitionKey = 6;
  string elementId = 7;
  int64 elementInstanceKey = 8;
  string customHeaders = 9;
  string worker = 10;
  int32 retries = 11;
  int64 deadline = 12;
  string variables = 13;
  string tenantId = 14;
}

// ── CompleteJob ─────────────────────────────────────────────────────────

message CompleteJobRequest {
  int64 jobKey = 1;
  string variables = 2;
}

message CompleteJobResponse {}

// ── FailJob ─────────────────────────────────────────────────────────────
// retries is the number to leave remaining AFTER this failure (Zeebe's
// convention) — NOT a pre-decrement current count. See
// internal/service/job_service.go's FailJob.

message FailJobRequest {
  int64 jobKey = 1;
  int32 retries = 2;
  string errorMessage = 3;
  int64 retryBackOff = 4;
  string variables = 5;
}

message FailJobResponse {}

// ── PublishMessage ──────────────────────────────────────────────────────
// Maps 1:1 onto internal/api.MessageController.Correlate, the same
// function the existing /engine-rest/message and /v2/messages/publication
// REST endpoints already share. Zeebe correlates by a single opaque
// correlationKey string rather than a named process variable; GoFlow's
// subscriptions are keyed by variable name, so (matching what the v2 REST
// handler already does) this is correlated against a synthetic
// "correlationKey" variable when set.

message PublishMessageRequest {
  string name = 1;
  string correlationKey = 2;
  int64 timeToLive = 3;
  string messageId = 4;
  string variables = 5;
  string tenantId = 6;
  // field 7 (businessId) intentionally omitted — out of scope.
}

message PublishMessageResponse {
  int64 key = 1;
  string tenantId = 2;
}

// ── CancelProcessInstance ───────────────────────────────────────────────
// Maps onto internal/service.TerminateProcessInstance, the same soft-
// delete termination logic the existing DELETE /process-instance/:id REST
// endpoint uses.

message CancelProcessInstanceRequest {
  int64 processInstanceKey = 1;
  // field 2 (operationReference) intentionally omitted — out of scope.
}

message CancelProcessInstanceResponse {}

// ── EvaluateDecision ────────────────────────────────────────────────────
// Maps onto internal/dmn.EvaluateDecisionTable, the same pure evaluator
// the existing POST /v2/decisions/:key/evaluation REST endpoint uses.
// GoFlow has no int64 key assigned to decisions yet (DeployResource's
// response only assigns keys to process definitions) — only decisionId
// (the DMN decision's string id) is supported; decisionKey is accepted on
// the wire for shape-completeness but not resolvable, matching how a real
// gateway would reject a key from a decision it doesn't know either.

message EvaluateDecisionRequest {
  int64 decisionKey = 1;
  string decisionId = 2;
  string variables = 3;
  string tenantId = 4;
}

message EvaluateDecisionResponse {
  int64 decisionKey = 1;
  string decisionId = 2;
  string decisionName = 3;
  int32 decisionVersion = 4;
  string decisionRequirementsId = 5;
  int64 decisionRequirementsKey = 6;
  string decisionOutput = 7;
  // field 8 (evaluatedDecisions) intentionally omitted — GoFlow's
  // evaluator doesn't produce a full decision-requirements-graph trace.
  string failedDecisionId = 9;
  string failureMessage = 10;
  string tenantId = 11;
}

// ── ResolveIncident ─────────────────────────────────────────────────────
// Maps onto internal/repository.IncidentRepository.Resolve — previously
// dead code (never called from any REST path; SetJobRetries uses the
// separate ResolveByJobID instead). Since incidents have never had a
// zeebe_keys entry minted anywhere (no gRPC-side incident listing exists
// to do it lazily, and real Zeebe's own Gateway protocol has none either
// — real clients learn incident keys from Operate/exporters), the REST
// GetIncident/ListIncidents responses now also return a zeebeKey field as
// the bridge (see internal/api/incident_controller.go).

message ResolveIncidentRequest {
  int64 incidentKey = 1;
}

message ResolveIncidentResponse {}

// ── ModifyProcessInstance ───────────────────────────────────────────────
// See the file-level comment above for why this only supports one
// implied move per call via activateInstructions[0], deriving the source
// element from the instance's single active execution rather than from
// terminateInstructions (whose only field, elementInstanceKey, GoFlow has
// no mapping for).

message ModifyProcessInstanceRequest {
  int64 processInstanceKey = 1;
  repeated ActivateInstruction activateInstructions = 2;
  repeated TerminateInstruction terminateInstructions = 3;
}

message ActivateInstruction {
  string elementId = 1;
}

message TerminateInstruction {
  int64 elementInstanceKey = 1;
}

message ModifyProcessInstanceResponse {}
