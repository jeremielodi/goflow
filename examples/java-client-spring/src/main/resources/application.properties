spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

# GoFlow's Camunda 7 REST API: every remote service calls this base URL.
feign.client.config.default.url=${GOFLOW_URL:http://127.0.0.1:8080}/engine-rest

# HTTP Basic with a GoFlow user (the starter's own setting; a RequestInterceptor
# bean of the application is not applied to its clients).
camundaplatformrest.security.basicAuth.username=${GOFLOW_USER:admin@goflow.com}
camundaplatformrest.security.basicAuth.password=${GOFLOW_PASSWORD:admin123}
