# docker-compose.yaml

services:
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: goflow-postgres
    environment:
      POSTGRES_DB: goflow
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goflow123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goflow-network
    restart: unless-stopped

  # Redpanda (Kafka-wire-compatible event log — Phase 0 shadow-mode event
  # sourcing scoping, see architecture/event-sourced-kafka-design.md; single
  # node, dev-mode only, not a durability/HA setup)
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: goflow-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - goflow-network
    restart: unless-stopped

  # GoFlow Application
  goflow:
    build: .
    container_name: goflow-app
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: goflow
      DB_PASS: ${POSTGRES_PASSWORD:-goflow123}
      DB_NAME: goflow

      # Event log (Phase 0 shadow mode — see internal/eventlog)
      KAFKA_BROKERS: redpanda:9092

      # Queue Settings
      QUEUE_MAX_RETRIES: 3
      QUEUE_RETRY_BACKOFF_BASE: 1s
      QUEUE_RETRY_MAX_BACKOFF: 5m
      QUEUE_RETRY_SCHEDULER_INTERVAL: 5s
      QUEUE_STATS_UPDATE_INTERVAL: 30s
      QUEUE_CLEANUP_OLDER_THAN: 24h
      
      # Server
      # Port d'écoute DANS le conteneur : reste 8080 (nginx proxifie vers
      # goflow:8080). Le port exposé sur l'hôte vient de SERVER_PORT (.env).
      SERVER_PORT: 8080
      QUEUE_WORKERS: 10
      
      # JWT signing key — required, read from .env (never hardcode it here).
      # Generate one with: openssl rand -base64 48
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}

      # Super User (valeurs lues depuis .env)
      SUPER_USER_NAME: ${SUPER_USER_NAME:-admin}
      SUPER_USER_EMAIL: ${SUPER_USER_EMAIL:-admin@goflow.com}
      SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD:-admin123}
      
      # Other
      GOFLOW_ENV: production
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "26500:26500" # gRPC gateway (Zeebe protocol subset — see internal/zeebegrpc)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - goflow-network
    restart: unless-stopped

  # GoFlow Frontend (React + nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goflow-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      goflow:
        condition: service_healthy
    networks:
      - goflow-network
    restart: unless-stopped

networks:
  goflow-network:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data: